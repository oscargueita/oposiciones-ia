openapi: 3.0.3
info:
  title: Oposiciones IA - Repaso por Palabra Clave API (003)
  version: 0.3.0
paths:
  /api/v1/repasar:
    get:
      summary: Top-5 fragmentos por palabra clave con cita y audio
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
        - name: temaId
          in: query
          required: false
          schema:
            type: integer
          description: Acota a un tema; por defecto todo el temario
        - name: topK
          in: query
          required: false
          schema:
            type: integer
            default: 5
      responses:
        '200':
          description: Lista (vacía = sin resultados, nunca inventado)
        '422':
          description: Consulta vacía o inválida
        '404':
          description: Tema de acotación no existe
