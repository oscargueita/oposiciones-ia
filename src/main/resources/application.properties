spring.application.name=oposiciones-ia

# SQLite local (fichero en la raiz del proyecto, gitignored)
spring.datasource.url=jdbc:sqlite:oposiciones.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=none
# Flyway es dueño del esquema; SQLite exige INTEGER PRIMARY KEY AUTOINCREMENT
# mientras Hibernate valida Long como BIGINT: validate siempre fallaría.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.batch_size=50

# Flyway gestiona el esquema
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Ollama local
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=llama3.1:8b
spring.ai.ollama.embedding.model=nomic-embed-text
